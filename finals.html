<!DOCTYPE html>
<html>
<head>
    <title>Thursday League Top 10 Final Standings</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #ffcc00;
            font-size: 48px;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            margin: 0 auto 40px auto;
            font-size: 24px;
        }

        th {
            background: #333;
            padding: 10px;
        }

        td {
            padding: 10px;
            border: 1px solid #555;
        }

        tr:nth-child(even) {
            background: #222;
        }

        #logo {
            position: fixed;
            width: 150px;
            height: auto;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        body > *:not(#logo) {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>

<img id="logo" src="b1b-logo.png" alt="B1B Logo">

<h1>Thursday League Top 10 Final Standings</h1>

<table>
<tr>
    <th>Player</th>
    <th>Points</th>
</tr>

<tr><td>1. Ken Lee</td><td>97</td></tr>
<tr><td>2. The Iceman Cometh</td><td>68</td></tr>
<tr><td>3. Ms Jackson</td><td>68</td></tr>
<tr><td>4. A Noisy Tree</td><td>59</td></tr>
<tr><td>5. IDK?</td><td>55</td></tr>
<tr><td>6. El Cammadoro</td><td>45</td></tr>
<tr><td>7. Sara (Bucket)</td><td>44</td></tr>
<tr><td>8. Owen</td><td>43</td></tr>
<tr><td>9. Joe B.</td><td>41</td></tr>
<tr><td>10. Mike Koenamann</td><td>35</td></tr>
</table>

<p style="text-align:center;font-size:60px;">
CONGRATULATIONS JOBI ON WINNING THE TOURNAMENT! 
</p>

<p style="text-align:center;font-size:28px;">
New Season Starts September 3rd!
</p>

<script>
const logo = document.getElementById("logo");

let x = 100;
let y = 100;
let dx = 2;
let dy = 2;

function animate() {
    const logoWidth = logo.offsetWidth;
    const logoHeight = logo.offsetHeight;

    x += dx;
    y += dy;

    if (x + logoWidth >= window.innerWidth || x <= 0) {
        dx = -dx;
    }

    if (y + logoHeight >= window.innerHeight || y <= 0) {
        dy = -dy;
    }

    logo.style.left = x + "px";
    logo.style.top = y + "px";

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
